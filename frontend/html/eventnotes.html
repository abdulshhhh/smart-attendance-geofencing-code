<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGEO - Event Calendar </title>
    <link rel="icon" href="sjce.png" type="image/x-icon">
    <style>
        /* Background Video */
        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.5;
        }

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: transparent;
            margin: 0;
        }

        .calendar {
            width: 350px;
            margin: auto;
            background: rgba(14, 13, 13, 0.2);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            overflow: hidden;
            padding-bottom: 10px;
        }
        .header {
            background: rgba(0, 123, 255, 0.8);
            color: white;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header button {
            background: none;
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            background: #f0f0f0;
            padding: 10px;
            font-weight: bold;
        }
        .dates {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            padding: 10px;
        }
        .date {
            padding: 10px;
            border-radius: 5px;
            background: #ffffff;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
            position: relative;
        }
        .date:hover {
            background: #007bff;
            color: white;
        }
        .event {
            font-size: 12px;
            color: white;
            background: red;
            border-radius: 5px;
            padding: 2px;
            margin-top: 5px;
            display: inline-block;
        }
        .event-image {
            width: 100%;
            margin-top: 5px;
            border-radius: 5px;
        }
        .modal {
            display: none;
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: rgb(17, 16, 16);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            text-align: left;
        }
        .modal input {
            display: block;
            margin: 10px 0;
            padding: 8px;
            width: 100%;
        }
        .modal button {
            background: #007bff;
            color: white;
            padding: 8px 15px;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }
        /* Style for the Hack Event button */
        #hackEventButton {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        #hackEventButton:hover {
            background-color: #218838;
        }
        /* Pinned Events Section */
        .pinned-events {
            margin-top: 20px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }
        .pinned-events h3 {
            margin: 0;
            padding-bottom: 10px;
            border-bottom: 1px solid #ccc;
        }
        .pinned-event {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
        }
        .pinned-event button {
            background: #ff4d4d;
            color: white;
            border: none;
            padding: 3px 8px;
            border-radius: 3px;
            cursor: pointer;
        }
        /* Notes Button */
        #notesButton {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #ffc107;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        #notesButton:hover {
            background-color: #e0a800;
        }
        /* Enhanced To-Do List Modal */
        #todoModal {
            display: none;
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            width: 80%;
            max-width: 600px;
        }
        #todoModal h1 {
            text-align: center;
            color: #007bff;
        }
        #todoModal .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        #todoModal input, #todoModal select, #todoModal button {
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            width: 100%;
            font-size: 16px;
        }
        #todoModal button {
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        #todoModal button:hover {
            background: #0056b3;
        }
        #todoModal .task-list {
            margin-top: 20px;
        }
        #todoModal .task-item {
            background: #f9f9f9;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #todoModal .task-item.completed {
            background: #e0f7fa;
            border-color: #007bff;
        }
        #todoModal .task-item.completed .task-title {
            text-decoration: line-through;
            color: #888;
        }
        #todoModal .task-title {
            font-weight: bold;
        }
        #todoModal .task-details {
            font-size: 14px;
            color: #555;
        }
        #todoModal .task-actions {
            display: flex;
            gap: 10px;
        }
        #todoModal .task-actions button {
            padding: 5px 10px;
            font-size: 14px;
        }
        #todoModal .subtask-list {
            margin-left: 20px;
            margin-top: 10px;
        }
        #todoModal .subtask-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 5px 0;
        }
        #todoModal .subtask-item input[type="checkbox"] {
            margin: 0;
        }
        #todoModal .completed-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #007bff;
        }
        #todoModal .completed-section h2 {
            color: #007bff;
        }
    </style>
</head>
<body>

    <!-- Background Video -->
    <div class="video-container">
        <video autoplay loop muted>
            <source src="cloud.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <h1>Event Calendar</h1>

    <div class="calendar">
        <div class="header">
            <button id="prevMonth">❮</button>
            <h2 id="monthYear"></h2>
            <button id="nextMonth">❯</button>
        </div>
        <div class="days">
            <div>Sun</div>
            <div>Mon</div>
            <div>Tue</div>
            <div>Wed</div>
            <div>Thu</div>
            <div>Fri</div>
            <div>Sat</div>
        </div>
        <div class="dates" id="dates"></div>
    </div>

    <!-- Pinned Events Section -->
    <div class="pinned-events">
        <h3>Pinned Events</h3>
        <div id="pinnedEventsList"></div>
    </div>

    <!-- Notes Button -->
    <button id="notesButton">Notes</button>

    <!-- Hack Event Button -->
    <button id="hackEventButton">Hack Event</button>

    <script>
    document.getElementById("hackEventButton").addEventListener("click", function() {
        window.location.href = "hac event.html";
    });
    </script>
    

    <!-- To-Do List Modal -->
    <div class="modal" id="todoModal">
        <h1> To-Do List</h1>
        <div class="container">
            <!-- Add Task Form -->
            <input type="text" id="taskInput" placeholder="Add a new task">
            <input type="date" id="dueDate">
            <select id="priority">
                <option value="Low">Low Priority</option>
                <option value="Medium">Medium Priority</option>
                <option value="High">High Priority</option>
            </select>
            <button id="addTask">Add Task</button>

            <!-- Task List -->
            <div class="task-list" id="taskList"></div>

            <!-- Completed Tasks Section -->
            <div class="completed-section">
                <h2>Completed Tasks</h2>
                <div id="completedTasks"></div>
            </div>
        </div>
    </div>

    <div class="overlay" id="overlay"></div>
    <div class="modal" id="eventModal">
        <h2>Add Event</h2>
        <input type="text" id="eventName" placeholder="Event Name">
        <input type="time" id="eventTime" placeholder="Event Time">
        <input type="text" id="eventVenue" placeholder="Event Venue">
        <input type="file" id="eventImage" accept="image/*" onchange="previewImage()">
        <img id="imagePreview" style="width: 100%; margin-top: 10px; display: none;">
        <button id="saveEvent">Save Event</button>
        <button onclick="closeModal()">Cancel</button>
        <button id="pinEvent">Pin Event</button>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            let currentDate = new Date();
            let selectedDate = null;
            let events = JSON.parse(localStorage.getItem("events")) || {};
            let pinnedEvents = JSON.parse(localStorage.getItem("pinnedEvents")) || [];

            function renderCalendar() {
                const monthYear = document.getElementById("monthYear");
                const datesContainer = document.getElementById("dates");

                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();

                const firstDay = new Date(year, month, 1).getDay();
                const lastDate = new Date(year, month + 1, 0).getDate();

                monthYear.innerText = currentDate.toLocaleDateString("en-US", { month: "long", year: "numeric" });

                datesContainer.innerHTML = "";

                for (let i = 0; i < firstDay; i++) {
                    const emptyDiv = document.createElement("div");
                    emptyDiv.classList.add("date", "empty");
                    datesContainer.appendChild(emptyDiv);
                }

                for (let day = 1; day <= lastDate; day++) {
                    const dateDiv = document.createElement("div");
                    dateDiv.classList.add("date");
                    dateDiv.innerText = day;
                    dateDiv.onclick = () => openModal(day);

                    const eventKey = `${year}-${month + 1}-${day}`;
                    if (events[eventKey]) {
                        const eventDiv = document.createElement("div");
                        eventDiv.classList.add("event");
                        eventDiv.innerText = events[eventKey].name;
                        dateDiv.appendChild(eventDiv);

                        if (events[eventKey].image) {
                            const eventImage = document.createElement("img");
                            eventImage.src = events[eventKey].image;
                            eventImage.classList.add("event-image");
                            dateDiv.appendChild(eventImage);
                        }
                    }

                    datesContainer.appendChild(dateDiv);
                }
            }

            function renderPinnedEvents() {
                const pinnedEventsList = document.getElementById("pinnedEventsList");
                pinnedEventsList.innerHTML = "";

                pinnedEvents.forEach((event, index) => {
                    const eventDiv = document.createElement("div");
                    eventDiv.classList.add("pinned-event");
                    eventDiv.innerHTML = `
                        <span>${event.name} (${event.date})</span>
                        <button onclick="unpinEvent(${index})">Unpin</button>
                    `;
                    pinnedEventsList.appendChild(eventDiv);
                });
            }

            function openModal(day) {
                selectedDate = `${currentDate.getFullYear()}-${currentDate.getMonth() + 1}-${day}`;
                document.getElementById("eventModal").style.display = "block";
                document.getElementById("overlay").style.display = "block";
            }

            function closeModal() {
                document.getElementById("eventModal").style.display = "none";
                document.getElementById("overlay").style.display = "none";
                document.getElementById("imagePreview").style.display = "none";
                document.getElementById("eventImage").value = "";
            }

            window.previewImage = function() {
                const file = document.getElementById("eventImage").files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        document.getElementById("imagePreview").src = e.target.result;
                        document.getElementById("imagePreview").style.display = "block";
                    };
                    reader.readAsDataURL(file);
                }
            }

            document.getElementById("saveEvent").addEventListener("click", function () {
                const name = document.getElementById("eventName").value;
                const imageFile = document.getElementById("eventImage").files[0];

                if (imageFile) {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        events[selectedDate] = {
                            name: name,
                            image: e.target.result,
                        };
                        localStorage.setItem("events", JSON.stringify(events));
                        closeModal();
                        renderCalendar();
                    };
                    reader.readAsDataURL(imageFile);
                } else {
                    events[selectedDate] = { name: name };
                    localStorage.setItem("events", JSON.stringify(events));
                    closeModal();
                    renderCalendar();
                }
            });

            document.getElementById("pinEvent").addEventListener("click", function () {
                const name = document.getElementById("eventName").value;
                if (name && selectedDate) {
                    pinnedEvents.push({ name: name, date: selectedDate });
                    localStorage.setItem("pinnedEvents", JSON.stringify(pinnedEvents));
                    renderPinnedEvents();
                    closeModal();
                }
            });

            window.unpinEvent = function (index) {
                pinnedEvents.splice(index, 1);
                localStorage.setItem("pinnedEvents", JSON.stringify(pinnedEvents));
                renderPinnedEvents();
            };

            document.getElementById("prevMonth").addEventListener("click", function () {
                currentDate.setMonth(currentDate.getMonth() - 1);
                renderCalendar();
            });

            document.getElementById("nextMonth").addEventListener("click", function () {
                currentDate.setMonth(currentDate.getMonth() + 1);
                renderCalendar();
            });

            // Notes Button Functionality
            document.getElementById("notesButton").addEventListener("click", function () {
                document.getElementById("todoModal").style.display = "block";
                document.getElementById("overlay").style.display = "block";
            });

            // Enhanced To-Do List Functionality
            let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
            let completedTasks = JSON.parse(localStorage.getItem("completedTasks")) || [];

            function renderTasks() {
                const taskList = document.getElementById("taskList");
                const completedTasksList = document.getElementById("completedTasks");

                taskList.innerHTML = "";
                completedTasksList.innerHTML = "";

                tasks.forEach((task, index) => {
                    const taskItem = document.createElement("div");
                    taskItem.classList.add("task-item");
                    taskItem.innerHTML = `
                        <div>
                            <div class="task-title">${task.title}</div>
                            <div class="task-details">
                                Due: ${task.dueDate} | Priority: ${task.priority}
                            </div>
                            <div class="subtask-list" id="subtasks-${index}"></div>
                            <input type="text" id="subtaskInput-${index}" placeholder="Add a subtask">
                            <button onclick="addSubtask(${index})">Add Subtask</button>
                        </div>
                        <div class="task-actions">
                            <button onclick="completeTask(${index})">Complete</button>
                            <button onclick="deleteTask(${index})">Delete</button>
                        </div>
                    `;
                    taskList.appendChild(taskItem);

                    // Render subtasks
                    const subtaskList = document.getElementById(`subtasks-${index}`);
                    if (task.subtasks && Array.isArray(task.subtasks)) {
                        task.subtasks.forEach((subtask, subIndex) => {
                            const subtaskItem = document.createElement("div");
                            subtaskItem.classList.add("subtask-item");
                            subtaskItem.innerHTML = `
                                <input type="checkbox" id="subtask-${index}-${subIndex}" ${subtask.completed ? "checked" : ""} onchange="toggleSubtask(${index}, ${subIndex})">
                                <label for="subtask-${index}-${subIndex}" class="${subtask.completed ? "completed" : ""}">${subtask.text}</label>
                            `;
                            subtaskList.appendChild(subtaskItem);
                        });
                    }
                });

                completedTasks.forEach((task, index) => {
                    const taskItem = document.createElement("div");
                    taskItem.classList.add("task-item", "completed");
                    taskItem.innerHTML = `
                        <div>
                            <div class="task-title">${task.title}</div>
                            <div class="task-details">
                                Due: ${task.dueDate} | Priority: ${task.priority}
                            </div>
                        </div>
                        <div class="task-actions">
                            <button onclick="deleteCompletedTask(${index})">Delete</button>
                        </div>
                    `;
                    completedTasksList.appendChild(taskItem);
                });
            }

            // Function to add a new task
            document.getElementById("addTask").addEventListener("click", function () {
                const taskInput = document.getElementById("taskInput");
                const dueDate = document.getElementById("dueDate");
                const priority = document.getElementById("priority");

                if (taskInput.value.trim() === "") {
                    alert("Please enter a task!");
                    return;
                }

                const newTask = {
                    title: taskInput.value.trim(),
                    dueDate: dueDate.value || "No due date",
                    priority: priority.value,
                    subtasks: [],
                };

                tasks.push(newTask);
                localStorage.setItem("tasks", JSON.stringify(tasks));
                taskInput.value = "";
                dueDate.value = "";
                priority.value = "Low";
                renderTasks();
            });

            // Function to add a subtask
            window.addSubtask = function (index) {
                const subtaskInput = document.getElementById(`subtaskInput-${index}`);
                const subtaskText = subtaskInput.value.trim();

                if (subtaskText === "") {
                    alert("Please enter a subtask!");
                    return;
                }

                if (!tasks[index].subtasks) {
                    tasks[index].subtasks = [];
                }
                
                tasks[index].subtasks.push({ text: subtaskText, completed: false });
                localStorage.setItem("tasks", JSON.stringify(tasks));
                subtaskInput.value = "";
                renderTasks();
            };

            // Function to toggle subtask completion
            window.toggleSubtask = function (taskIndex, subtaskIndex) {
                tasks[taskIndex].subtasks[subtaskIndex].completed = !tasks[taskIndex].subtasks[subtaskIndex].completed;
                localStorage.setItem("tasks", JSON.stringify(tasks));
                renderTasks();
            };

            // Function to mark a task as completed
            window.completeTask = function (index) {
                const task = tasks.splice(index, 1)[0];
                completedTasks.push(task);
                localStorage.setItem("tasks", JSON.stringify(tasks));
                localStorage.setItem("completedTasks", JSON.stringify(completedTasks));
                renderTasks();
            };

            // Function to delete a task
            window.deleteTask = function (index) {
                tasks.splice(index, 1);
                localStorage.setItem("tasks", JSON.stringify(tasks));
                renderTasks();
            };

            // Function to delete a completed task
            window.deleteCompletedTask = function (index) {
                completedTasks.splice(index, 1);
                localStorage.setItem("completedTasks", JSON.stringify(completedTasks));
                renderTasks();
            };

            // Close To-Do List Modal when clicking overlay
            document.getElementById("overlay").addEventListener("click", function () {
                document.getElementById("todoModal").style.display = "none";
                document.getElementById("eventModal").style.display = "none";
                document.getElementById("overlay").style.display = "none";
            });

            // Make closeModal function global
            window.closeModal = closeModal;

            // Initialize the app
            renderCalendar();
            renderPinnedEvents();
            renderTasks();
        });
    </script>
</body>
</html>
