<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="REGEO - Next-Gen Feedback Form with AI Insights & Ultra Responsive UI">
    <title>REGEO | Smart Feedback System</title>
    <link href="frontend/https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="frontend/https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="frontend/https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="frontend/https://cdn.jsdelivr.net/npm/confetti-js@0.0.18/dist/index.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
        }
        .form-container {
            animation: fadeInUp 1s ease-in-out;
            padding: 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            margin: 50px auto;
            max-width: 600px;
        }
        .map-container {
            height: 350px;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 20px;
            background: #1c1c1c;
            position: relative;
        }
        .btn-custom {
            background: linear-gradient(135deg, #ff8e35, #ff6700);
            color: #ffffff;
            border: none;
            transition: all 0.3s ease;
            font-weight: bold;
            padding: 12px;
            border-radius: 10px;
        }
        .btn-custom:hover {
            background: linear-gradient(135deg, #ff6700, #ff8e35);
            transform: scale(1.05);
        }
        .progress-bar-custom {
            background: linear-gradient(135deg, #6dd5fa, #2980b9);
            height: 8px;
            width: 0;
            border-radius: 5px;
            transition: width 0.5s ease;
        }
        .sentiment {
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container form-container text-center">
        <h1>REGEO Smart Feedback</h1>
        <p>Refining geofencing experiences with AI insights.</p>
        <div id="map" class="map-container"></div>
        <form id="feedbackForm" novalidate>
            <input type="text" class="form-control mb-3" id="name" placeholder="Your Name" required>
            <select class="form-select mb-3" id="rating" required>
                <option value="" disabled selected>Rate your experience</option>
                <option value="5">5 - Excellent</option>
                <option value="4">4 - Very Good</option>
                <option value="3">3 - Good</option>
                <option value="2">2 - Fair</option>
                <option value="1">1 - Poor</option>
            </select>
            <textarea class="form-control mb-3" id="feedback" rows="4" maxlength="300" placeholder="Your feedback"></textarea>
            <div id="sentimentAnalysis" class="sentiment"></div>
            <div class="progress-bar-custom" id="progressBar"></div>
            <button type="submit" class="btn btn-custom w-100 mt-3">Submit Feedback</button>
        </form>
        <canvas id="confetti" style="position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; display:none;"></canvas>
    </div>

    <script>
        // Initialize Map with High Precision
        const initMap = () => {
            const map = L.map('map').setView([0, 0], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);

            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(
                    (position) => {
                        const { latitude: lat, longitude: lng } = position.coords;
                        map.setView([lat, lng], 18);
                        L.marker([lat, lng]).addTo(map).bindPopup("You're here! 📍").openPopup();
                    },
                    () => alert('Geolocation failed. Please check permissions.'),
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                alert('Geolocation is not supported by your browser.');
            }
        };

        // Form progress bar
        const updateProgressBar = () => {
            const progressBar = document.getElementById('progressBar');
            const inputs = Array.from(document.querySelectorAll('#feedbackForm input, #feedbackForm select, #feedbackForm textarea'));
            const completedFields = inputs.filter(input => input.value.trim() !== '').length;
            const progress = Math.min((completedFields / inputs.length) * 100, 100);
            progressBar.style.width = `${progress}%`;
        };

        // Confetti Effect
        const launchConfetti = () => {
            const confettiCanvas = document.getElementById('confetti');
            confettiCanvas.style.display = 'block';

            const confettiSettings = { target: confettiCanvas, max: 150, size: 1.5 };
            const confetti = new ConfettiGenerator(confettiSettings);
            confetti.render();

            setTimeout(() => confettiCanvas.style.display = 'none', 3000);
        };

        // AI Sentiment Analysis
        const analyzeSentiment = () => {
            const feedback = document.getElementById('feedback').value.toLowerCase();
            const sentiment = document.getElementById('sentimentAnalysis');

            if (feedback.includes('excellent') || feedback.includes('great') || feedback.includes('love')) {
                sentiment.textContent = 'Sentiment: 😊 Positive';
                sentiment.style.color = 'green';
            } else if (feedback.includes('poor') || feedback.includes('bad') || feedback.includes('hate')) {
                sentiment.textContent = 'Sentiment: 😔 Negative';
                sentiment.style.color = 'red';
            } else {
                sentiment.textContent = 'Sentiment: 🤔 Neutral';
                sentiment.style.color = 'yellow';
            }
        };

        // Setup event listeners
        const setupEventListeners = () => {
            const feedbackForm = document.getElementById('feedbackForm');
            feedbackForm.addEventListener('input', updateProgressBar);

            const feedbackInput = document.getElementById('feedback');
            feedbackInput.addEventListener('input', analyzeSentiment);

            feedbackForm.addEventListener('submit', (e) => {
                e.preventDefault();
                launchConfetti();
                alert('Thank you for your feedback!');
                feedbackForm.reset();
                document.getElementById('progressBar').style.width = '0%';
                document.getElementById('sentimentAnalysis').textContent = '';
            });
        };

        window.onload = () => {
            initMap();
            setupEventListeners();
        };
    </script>
</body>
</html>
