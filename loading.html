<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regeo | Attendance Reimagined</title>
    <link rel="icon" href="sjce.png" type="image/x-icon">
    <!-- Modern CSS Framework - Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <!-- Animation Libraries -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <!-- 3D & Animation Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/ScrollTrigger.min.js"></script>
    <!-- Particle Effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>
    <!-- Scroll Effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.9.6/lottie.min.js"></script>
    <!-- Custom Styles with Modern Design Principles -->
    <style>
        :root {
            --primary-color: #8a2be2;
            --secondary-color: #00bfff;
            --accent-color: #ff1493;
            --dark-bg: #0f0c29;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        
        /* Neumorphic Design Elements */
        .neumorphic {
            box-shadow: 
                20px 20px 60px rgba(0, 0, 0, 0.5),
                -20px -20px 60px rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        
        .neumorphic:hover {
            box-shadow: 
                10px 10px 30px rgba(0, 0, 0, 0.6),
                -10px -10px 30px rgba(255, 255, 255, 0.08);
        }
        
        /* Modern Glassmorphism */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            transition: all 0.5s ease;
        }
        
        /* 3D Typography */
        .logo-3d {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: clamp(4rem, 10vw, 8rem);
            color: transparent;
            -webkit-text-stroke: 2px rgba(255, 255, 255, 0.8);
            position: relative;
            text-transform: uppercase;
            letter-spacing: 8px;
            transform-style: preserve-3d;
            perspective: 1000px;
        }
        
        .logo-3d::before {
            content: "Regeo";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, var(--secondary-color), var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            transform: translateZ(-5px);
            filter: blur(0px);
            opacity: 0;
            animation: fillLogo 2s ease forwards 1s;
        }
        
        /* Gradient Border Buttons */
        .gradient-border-btn {
            position: relative;
            background: rgba(20, 20, 40, 0.5);
            z-index: 1;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .gradient-border-btn::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            z-index: -1;
            background: linear-gradient(45deg, var(--secondary-color), var(--primary-color), var(--accent-color));
            border-radius: 28px;
        }
        
        .gradient-border-btn::after {
            content: '';
            position: absolute;
            top: 1px;
            left: 1px;
            right: 1px;
            bottom: 1px;
            background: rgba(20, 20, 40, 0.7);
            backdrop-filter: blur(4px);
            border-radius: 26px;
            z-index: -1;
        }
        
        .gradient-border-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 10px 25px rgba(138, 43, 226, 0.4);
        }
        
        /* Loading Bar Animation */
        .progress-bar {
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }
        
        .progress-value {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--secondary-color), var(--primary-color), var(--accent-color));
            border-radius: 3px;
            animation: progress 4s ease-out forwards;
        }

        /* Custom Animations */
        @keyframes progress {
            0% { width: 0%; }
            50% { width: 60%; }
            80% { width: 85%; }
            100% { width: 100%; }
        }
        
        @keyframes fillLogo {
            0% { opacity: 0; filter: blur(10px); }
            100% { opacity: 1; filter: blur(0px); }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotateX(0deg); }
            50% { transform: translateY(-15px) rotateX(5deg); }
        }
        
        @keyframes pulse {
            0% { opacity: 0.5; transform: scale(0.8); }
            100% { opacity: 0.8; transform: scale(1.1); }
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(var(--secondary-color), var(--primary-color));
            border-radius: 4px;
        }
        
        /* Particle Effect Overlay */
        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
        }
        
        /* Modern Card Design */
        .feature-card {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        /* Responsive Adjustments */
        @media (max-width: 768px) {
            .logo-3d {
                font-size: clamp(3rem, 12vw, 5rem);
                letter-spacing: 4px;
            }
            
            .glass-container {
                width: 90% !important;
                max-width: none !important;
            }
        }
    </style>
</head>
<body class="relative">
    <!-- Particle Background -->
    <div id="particles-js"></div>
    
    <!-- Main Content -->
    <div class="relative z-10 flex justify-center items-center min-h-screen">
        <!-- Glassmorphic Card -->
        <div class="glass glass-container neumorphic w-full max-w-3xl h-96 relative overflow-hidden mx-4" id="glass-card">
            <!-- Card Content -->
            <div class="h-full w-full flex flex-col justify-center items-center p-8">
                <!-- Logo Container with 3D Effect -->
                <div class="logo-wrapper relative animate__animated animate__fadeIn" style="animation-duration: 1.5s;">
                    <div class="logo-3d">Regeo</div>
                </div>
                
                <!-- Animated Tagline -->
                <div class="tagline mt-4 text-xl md:text-2xl text-center text-white/80 font-light tracking-wide animate__animated animate__fadeInUp" style="animation-delay: 1s;">
                    <span class="animate__animated animate__fadeIn" style="animation-delay: 1.5s; display: inline-block;">Your attendance</span>
                    <span class="animate__animated animate__fadeIn ml-2" style="animation-delay: 2s; display: inline-block;">our guarantee</span>
                </div>
                
                <!-- Progress Bar -->
                <div class="w-64 md:w-80 progress-bar mt-8">
                    <div class="progress-value"></div>
                </div>
                
                <!-- CTA Button with Gradient Border -->
                <button class="gradient-border-btn mt-8 py-3 px-10 text-white font-semibold tracking-wider uppercase text-sm animate__animated animate__fadeInUp" style="animation-delay: 3s;">
                    Get Started
                </button>
            </div>
            
            <!-- Gradient Glow Effect -->
            <div class="absolute inset-0 bg-gradient-radial from-purple-500/20 to-transparent opacity-70 pointer-events-none" style="animation: pulse 4s infinite alternate;"></div>
        </div>
    </div>
    
    <!-- 3D Objects Container -->
    <div id="three-container" class="absolute inset-0 z-0 pointer-events-none"></div>
    
    <!-- Loading Animation -->
    <div id="lottie-loading" class="fixed bottom-8 right-8 w-16 h-16 opacity-75"></div>
    
    <script>
        // Initialize Particles.js
        particlesJS("particles-js", {
            particles: {
                number: {
                    value: 100,
                    density: {
                        enable: true,
                        value_area: 800
                    }
                },
                color: {
                    value: "#ffffff"
                },
                shape: {
                    type: "circle",
                    stroke: {
                        width: 0,
                        color: "#000000"
                    }
                },
                opacity: {
                    value: 0.3,
                    random: true,
                    anim: {
                        enable: true,
                        speed: 1,
                        opacity_min: 0.1,
                        sync: false
                    }
                },
                size: {
                    value: 3,
                    random: true,
                    anim: {
                        enable: true,
                        speed: 2,
                        size_min: 0.1,
                        sync: false
                    }
                },
                line_linked: {
                    enable: true,
                    distance: 150,
                    color: "#8a2be2",
                    opacity: 0.2,
                    width: 1
                },
                move: {
                    enable: true,
                    speed: 1,
                    direction: "none",
                    random: true,
                    straight: false,
                    out_mode: "out",
                    bounce: false,
                    attract: {
                        enable: true,
                        rotateX: 600,
                        rotateY: 1200
                    }
                }
            },
            interactivity: {
                detect_on: "canvas",
                events: {
                    onhover: {
                        enable: true,
                        mode: "grab"
                    },
                    onclick: {
                        enable: true,
                        mode: "push"
                    },
                    resize: true
                },
                modes: {
                    grab: {
                        distance: 140,
                        line_linked: {
                            opacity: 0.5
                        }
                    },
                    push: {
                        particles_nb: 4
                    }
                }
            },
            retina_detect: true
        });

        // Three.js Scene Setup
        const container = document.getElementById('three-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);
        
        // Create 3D objects
        const torusGeometry = new THREE.TorusKnotGeometry(10, 3, 100, 16);
        const torusMaterial = new THREE.MeshBasicMaterial({ 
            color: 0x8a2be2, 
            wireframe: true,
            transparent: true,
            opacity: 0.2
        });
        const torusKnot = new THREE.Mesh(torusGeometry, torusMaterial);
        torusKnot.position.set(0, 0, -50);
        scene.add(torusKnot);
        
        // Add floating particles
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 3000;
        const posArray = new Float32Array(particlesCount * 3);
        
        for (let i = 0; i < particlesCount * 3; i += 3) {
            posArray[i] = (Math.random() - 0.5) * 10;
            posArray[i + 1] = (Math.random() - 0.5) * 10;
            posArray[i + 2] = (Math.random() - 0.5) * 10 - 5;
        }
        
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        
        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.01,
            color: 0x8a2be2,
            transparent: true,
            blending: THREE.AdditiveBlending
        });
        
        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);
        
        // Camera positioning
        camera.position.z = 5;
        
        // Mouse interaction variables
        let mouseX = 0;
        let mouseY = 0;
        
        // Track mouse movement
        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
            
            // Card tilt effect using GSAP
            gsap.to('#glass-card', {
                duration: 0.5,
                rotationY: mouseX * 10,
                rotationX: mouseY * 10,
                ease: 'power2.out'
            });
        });
        
        // Animation loop
        const animate = () => {
            requestAnimationFrame(animate);
            
            // Rotate 3D objects
            torusKnot.rotation.x += 0.003;
            torusKnot.rotation.y += 0.002;
            
            particlesMesh.rotation.x += 0.0005;
            particlesMesh.rotation.y += 0.0005;
            
            // Interactive movement based on mouse
            particlesMesh.rotation.x += mouseY * 0.0005;
            particlesMesh.rotation.y += mouseX * 0.0005;
            
            renderer.render(scene, camera);
        };
        
        animate();
        
        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Loading animation with Lottie
        const lottieLoading = lottie.loadAnimation({
            container: document.getElementById('lottie-loading'),
            renderer: 'svg',
            loop: true,
            autoplay: true,
            path: 'https://assets10.lottiefiles.com/packages/lf20_bhebjzpu.json'
        });
        
        // GSAP Timeline for smooth animations
        const tl = gsap.timeline({ defaults: { ease: "power3.out" } });
        
        tl.from(".logo-3d", {
            duration: 1.5,
            y: -100,
            opacity: 0,
            rotationX: 90,
            ease: "elastic.out(1, 0.3)"
        });
        
        // Set redirection after loading completes
        setTimeout(() => {
            tl.to(".glass", {
                duration: 0.8,
                y: -30,
                opacity: 0,
                ease: "power2.inOut",
                onComplete: () => {
                    window.location.href = "location.html";
                }
            });
        }, 5000);
        
        // Button hover animations with GSAP
        const btn = document.querySelector('.gradient-border-btn');
        
        btn.addEventListener('mouseenter', () => {
            gsap.to(btn, {
                duration: 0.3,
                scale: 1.05,
                boxShadow: '0 10px 30px rgba(138, 43, 226, 0.4)'
            });
        });
        
        btn.addEventListener('mouseleave', () => {
            gsap.to(btn, {
                duration: 0.3,
                scale: 1,
                boxShadow: '0 0 0 rgba(138, 43, 226, 0)'
            });
        });
        
        // Click event
        btn.addEventListener('click', () => {
            gsap.to(btn, {
                duration: 0.1,
                scale: 0.95,
                yoyo: true,
                repeat: 1,
                onComplete: () => {
                    window.location.href = "location.html";
                }
            });
        });
    </script>
</body>
</html>
