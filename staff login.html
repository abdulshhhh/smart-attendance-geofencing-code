<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login</title>
    <link rel="icon" href="sjce.png" type="image/x-icon">

    <style>
        body {
            font-family: sans-serif;
            background-image: url('St.jpg');
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-container {
            background-color: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 350px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo img {
            max-width: 200px;
        }

        .login-title {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #777;
        }

        input[type="email"],
        input[type="password"] {
            width: calc(100% - 12px);
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #ffc107;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .google-btn {
            width: 100%;
            margin-top: 10px;
            background-color: #db4437;
            color: white;
            border: none;
            padding: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        .forgot-password {
            text-align: center;
            margin-top: 15px;
        }

        .forgot-password a {
            color: #007bff;
            text-decoration: none;
            display: block;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="logo">
        <img src="logo.jpg" alt="University Logo"> 
    </div>
    
    <h2 class="login-title">STAFF LOGIN</h2>

    <form id="staffLoginForm">
        <div class="input-group">
            <label for="email">Staff Email</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>

        <button type="submit">Login</button>
    </form>

    <button class="google-btn" id="googleLogin">Sign in with Google</button>

    <div class="forgot-password">
        <a href="#">Forgot Password?</a>
    </div>
</div>

<!-- Firebase Authentication Script -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js";

    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyAq39lRnMNrVwAKTb4u6gzPHZWqnXHxrYQ",
        authDomain: "user-data-33e24.firebaseapp.com",
        projectId: "user-data-33e24",
        storageBucket: "user-data-33e24.appspot.com",
        messagingSenderId: "485056315169",
        appId: "1:485056315169:web:2af3c0afcdabc072e1c860"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // Staff Email/Password Login
    document.getElementById("staffLoginForm").addEventListener("submit", async function(event) {
        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();

        try {
            await signInWithEmailAndPassword(auth, email, password);
            alert("Login successful! Redirecting...");
            window.location.href = "adminnn.html";
        } catch (error) {
            alert("Error: " + error.message);
        }
    });

    // Google Sign-In
    document.getElementById("googleLogin").addEventListener("click", async function () {
        try {
            const result = await signInWithPopup(auth, provider);
            alert("Google Login successful! Redirecting...");
            window.location.href = "adminnn.html";
        } catch (error) {
            alert("Google Sign-In Error: " + error.message);
        }
    });
</script>

</body>
</html>
