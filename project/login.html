<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGEO</title>
    <link rel="icon" href="sjce.png" type="image/x-icon">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">REGEO</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Parallax Background -->
    <div class="parallax"></div>

    <!-- Login Form Container -->
    <div class="container">
        <div class="login-container">
            <h1 class="text-center title">REGEO</h1>
            <h6 class="text-center subtitle">St. Joseph's College of Engineering</h6>
            
            <form id="loginForm">
                <div class="form-floating mb-3">
                    <input type="text" id="name" name="name" class="form-control input-3d" placeholder="Full Name" required>
                    <label for="name">Full Name</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="text" id="number" name="number" class="form-control input-3d" placeholder="Roll Number" required>
                    <label for="number">Roll Number</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="text" id="dept" name="dept" class="form-control input-3d" placeholder="Dept & Sec" required>
                    <label for="dept">Dept & Sec</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="email" id="email" name="email" class="form-control input-3d" placeholder="Email ID" required>
                    <label for="email">Email ID</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="tel" id="phone" name="phone" class="form-control input-3d" placeholder="Phone Number" required>
                    <label for="phone">Phone Number</label>
                </div>
                <button type="submit" class="btn btn-primary btn-3d">Register</button>
            </form>
        </div>
    </div>

    <!-- Firebase SDK & Configuration -->
    <script type="module">
        // Import Firebase modules
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js";

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyB4HW7tLXY49srhc8x1ejwGDzghR_97aws",
            authDomain: "regeo-172bf.firebaseapp.com",
            projectId: "regeo-172bf",
            storageBucket: "regeo-172bf.firebasestorage.app",
            messagingSenderId: "629442595950",
            appId: "1:629442595950:web:bdaeaa097c8d0e94fdaa7f",
            measurementId: "G-RWMVW1SBQW"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Handle form submission
        document.getElementById("loginForm").addEventListener("submit", async function (event) {
            event.preventDefault(); // Prevent default form submission

            // Get form values
            const name = document.getElementById("name").value;
            const rollNumber = document.getElementById("number").value;
            const dept = document.getElementById("dept").value;
            const email = document.getElementById("email").value;
            const phone = document.getElementById("phone").value;

            try {
                // Store data in Firestore
                await addDoc(collection(db, "students"), {
                    name: name,
                    rollNumber: rollNumber,
                    dept: dept,
                    email: email,
                    phone: phone,
                    timestamp: new Date().toISOString()
                });

                alert("Registration Successful!");
                document.getElementById("loginForm").reset(); // Clear form fields
            } catch (error) {
                console.error("Error adding document: ", error);
                alert("Error: " + error.message);
            }
        });
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
