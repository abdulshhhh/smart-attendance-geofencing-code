<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - REGEO</title>
    <link rel="icon" href="sjce.png" type="image/x-icon">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar-brand {
            font-family: 'Arial Black', sans-serif;
            font-size: 1.8rem;
            letter-spacing: 1px;
        }
        .college-title {
            color: white;
            text-align: center;
            width: 100%;
            font-size: 1rem;
            font-weight: bold;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }
        .switch-link {
            text-align: center;
            margin-top: 10px;
        }
        .google-btn {
            width: 100%;
            margin-top: 10px;
            background-color: #db4437;
            color: white;
            border: none;
            padding: 10px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark position-relative">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">ℝ𝔼𝔾𝔼𝕆</a>
            <span class="college-title">ST. JOSEPH'S COLLEGE OF ENGINEERING</span>
        </div>
    </nav>

    <!-- Login Form Container -->
    <div class="container mt-5">
        <div class="login-container">
            <h1 class="text-center title" id="formTitle">Login to REGEO</h1>
            
            <form id="authForm">
                <div class="form-floating mb-3">
                    <input type="email" id="email" name="email" class="form-control" placeholder="Email ID" required>
                    <label for="email">Email ID</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="password" id="password" name="password" class="form-control" placeholder="Password" required>
                    <label for="password">Password</label>
                </div>
                <div class="form-floating mb-3" id="nameField" style="display: none;">
                    <input type="text" id="name" name="name" class="form-control" placeholder="Full Name">
                    <label for="name">Full Name</label>
                </div>
                <button type="submit" class="btn btn-primary w-100" id="submitBtn">Login</button>
            </form>
            
            <button class="google-btn" id="googleLogin">Sign in with Google</button>
            
            <p class="switch-link"><a href="#" id="switchForm">Don't have an account? Sign up</a></p>
        </div>
    </div>

    <!-- Firebase Authentication Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js";

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyAq39lRnMNrVwAKTb4u6gzPHZWqnXHxrYQ",
            authDomain: "user-data-33e24.firebaseapp.com",
            projectId: "user-data-33e24",
            storageBucket: "user-data-33e24.appspot.com",
            messagingSenderId: "485056315169",
            appId: "1:485056315169:web:2af3c0afcdabc072e1c860"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let isLogin = true;

        document.getElementById("switchForm").addEventListener("click", function () {
            isLogin = !isLogin;
            document.getElementById("formTitle").textContent = isLogin ? "Login to REGEO" : "Sign Up for REGEO";
            document.getElementById("submitBtn").textContent = isLogin ? "Login" : "Sign Up";
            document.getElementById("nameField").style.display = isLogin ? "none" : "block";
            document.getElementById("switchForm").textContent = isLogin ? "Don't have an account? Sign up" : "Already have an account? Login";
        });

        document.getElementById("authForm").addEventListener("submit", async function (event) {
            event.preventDefault();
            
            const email = document.getElementById("email")?.value.trim() || "";
            const password = document.getElementById("password")?.value.trim() || "";
            const name = document.getElementById("name")?.value.trim() || "";

            try {
                if (isLogin) {
                    // Login
                    await signInWithEmailAndPassword(auth, email, password);
                    alert("Login successful! Redirecting...");
                    window.location.href = "markin.html";
                } else {
                    // Sign Up
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    await setDoc(doc(db, "students", userCredential.user.uid), { email, name });
                    alert("Sign-up successful! Please log in.");
                    document.getElementById("switchForm").click();
                }
            } catch (error) {
                alert("Error: " + error.message);
            }
        });

        // Google Sign-In
        document.getElementById("googleLogin").addEventListener("click", async function () {
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                
                // Store user details in Firestore if first-time login
                const userRef = doc(db, "students", user.uid);
                await setDoc(userRef, { email: user.email, name: user.displayName }, { merge: true });

                alert("Google Login successful! Redirecting...");
                window.location.href = "markin.html";
            } catch (error) {
                alert("Google Sign-In Error: " + error.message);
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha
