<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - REGEO</title>
    <link rel="icon" href="C:\Users\LENOVO\project\project\sjce.png" type="image/x-icon">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
    <style>
        .navbar-brand {
            font-family: 'Arial Black', sans-serif;
            font-size: 1.8rem;
            letter-spacing: 1px;
        }
        .college-title {
            color: white;
            text-align: center;
            width: 100%;
            font-size: 1rem;
            font-weight: bold;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }
        .switch-link {
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark position-relative">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">ℝ𝔼𝔾𝔼𝕆</a>
            <span class="college-title">ST. JOSEPH'S COLLEGE OF ENGINEERING</span>
        </div>
    </nav>

    <!-- Login Form Container -->
    <div class="container mt-5">
        <div class="login-container">
            <h1 class="text-center title" id="formTitle">Login to REGEO</h1>
            
            <form id="authForm">
                <div class="form-floating mb-3">
                    <input type="email" id="email" name="email" class="form-control input-3d" placeholder="Email ID" required>
                    <label for="email">Email ID</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="text" id="rollNumber" name="rollNumber" class="form-control input-3d" placeholder="Roll Number" required>
                    <label for="rollNumber">Roll Number</label>
                </div>
                <div class="form-floating mb-3" id="nameField" style="display: none;">
                    <input type="text" id="name" name="name" class="form-control input-3d" placeholder="Full Name">
                    <label for="name">Full Name</label>
                </div>
                <button type="submit" class="btn btn-primary btn-3d w-100" id="submitBtn">Login</button>
            </form>
            <p class="switch-link"><a href="#" id="switchForm">Don't have an account? Sign up</a></p>
        </div>
    </div>

    <!-- Firebase Authentication Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs, setDoc, doc } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB4HW7tLXY49srhc8x1ejwGDzghR_97aws",
            authDomain: "regeo-172bf.firebaseapp.com",
            projectId: "regeo-172bf",
            storageBucket: "regeo-172bf.appspot.com",
            messagingSenderId: "629442595950",
            appId: "1:629442595950:web:bdaeaa097c8d0e94fdaa7f",
            measurementId: "G-RWMVW1SBQW"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let isLogin = true;

        document.getElementById("switchForm").addEventListener("click", function () {
            isLogin = !isLogin;
            document.getElementById("formTitle").textContent = isLogin ? "Login to REGEO" : "Sign Up for REGEO";
            document.getElementById("submitBtn").textContent = isLogin ? "Login" : "Sign Up";
            document.getElementById("nameField").style.display = isLogin ? "none" : "block";
            document.getElementById("switchForm").textContent = isLogin ? "Don't have an account? Sign up" : "Already have an account? Login";
        });

        document.getElementById("authForm").addEventListener("submit", async function (event) {
            event.preventDefault();
            const email = document.getElementById("email").value.trim();
            const rollNumber = document.getElementById("rollNumber").value.trim();
            const name = document.getElementById("name").value.trim();

            if (isLogin) {
                // Login
                try {
                    const q = query(collection(db, "students"), where("email", "==", email), where("rollNumber", "==", rollNumber));
                    const querySnapshot = await getDocs(q);
                    if (!querySnapshot.empty) {
                        alert("Login successful! Redirecting...");
                        window.location.href = "markin.html";
                    } else {
                        alert("Invalid email or roll number.");
                    }
                } catch (error) {
                    alert("Error: " + error.message);
                }
            } else {
                // Sign Up
                try {
                    await createUserWithEmailAndPassword(auth, email, rollNumber);
                    await setDoc(doc(db, "students", email), {
                        email,
                        rollNumber,
                        name
                    });
                    alert("Sign-up successful! Please log in.");
                    document.getElementById("switchForm").click();
                } catch (error) {
                    alert("Error: " + error.message);
                }
            }
        });
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
