<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - REGEO</title>
    <link rel="icon" href="C:\Users\LENOVO\project\project\sjce.png" type="image/x-icon">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
    <style>
        .navbar-brand {
            font-family: 'Arial Black', sans-serif;
            font-size: 1.8rem;
            letter-spacing: 1px;
        }
        .college-title {
            color: white;
            text-align: center;
            width: 100%;
            font-size: 1rem;
            font-weight: bold;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }
    </style>
</head>

<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark position-relative">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">ℝ𝔼𝔾𝔼𝕆</a>
            <span class="college-title">ST. JOSEPH'S COLLEGE OF ENGINEERING</span>
        </div>
    </nav>

    <!-- Parallax Background -->
    <div class="parallax"></div>

    <!-- Login Form Container -->
    <div class="container">
        <div class="login-container">
            <h1 class="text-center title">Login to REGEO</h1>
            
            <form id="loginForm">
                <div class="form-floating mb-3">
                    <input type="email" id="email" name="email" class="form-control input-3d" placeholder="Email ID" required>
                    <label for="email">Email ID</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="text" id="rollNumber" name="rollNumber" class="form-control input-3d" placeholder="Roll Number" required>
                    <label for="rollNumber">Roll Number</label>
                </div>
                <button type="submit" class="btn btn-primary btn-3d w-100">Login</button>
            </form>
        </div>
    </div>

    <!-- Firebase Authentication Script -->
    <script type="module">
        // Import Firebase modules
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js";

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyB4HW7tLXY49srhc8x1ejwGDzghR_97aws",
            authDomain: "regeo-172bf.firebaseapp.com",
            projectId: "regeo-172bf",
            storageBucket: "regeo-172bf.appspot.com",
            messagingSenderId: "629442595950",
            appId: "1:629442595950:web:bdaeaa097c8d0e94fdaa7f",
            measurementId: "G-RWMVW1SBQW"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById("loginForm").addEventListener("submit", async function (event) {
            event.preventDefault(); // Prevent default form submission

            const email = document.getElementById("email").value.trim();
            const rollNumber = document.getElementById("rollNumber").value.trim();

            // Query Firestore to find user by email and roll number
            const q = query(collection(db, "students"), where("email", "==", email), where("rollNumber", "==", rollNumber));

            try {
                const querySnapshot = await getDocs(q);

                if (!querySnapshot.empty) {
                    let userFound = false;

                    querySnapshot.forEach((doc) => {
                        const userData = doc.data();
                        
                        // **Check if roll number matches**
                        if (userData.rollNumber === rollNumber) {
                            alert(`Welcome, ${userData.name}!`);
                            userFound = true;
                            window.location.href = "markin.html"; // Redirect on successful login
                        }
                    });

                    if (!userFound) {
                        alert("Incorrect roll number. Please try again.");
                    }
                } else {
                    alert("Email and roll number do not match. Please try again.");
                }
            } catch (error) {
                console.error("Error fetching data: ", error);
                alert("Error: " + error.message);
            }
        });
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
