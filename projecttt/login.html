<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">REGEO</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="about.html">About</a> <!-- Updated to navigate to about.html -->
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Contact</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="profileDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <img src="profile.jpg" alt="Profile" id="profilePic" class="rounded-circle" width="30" height="30">
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="profileDropdown">
                            <li>
                                <a class="dropdown-item" href="#" id="uploadPicBtn">Add Profile Picture</a>
                            </li>
                            <li><a class="dropdown-item" href="INDEX.HTML">view profile</a></li>
                        </ul>
                        <!-- Hidden File Input for Profile Picture -->
                        <input type="file" id="profileInput" accept="image/*" style="display: none;">
                        
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Parallax Background -->
    <div class="parallax"></div>

    <!-- Login Form Container -->
    <div class="container">
        <div class="login-container">
            <h1 class="text-center title">REGEO</h1>
            <h6 class="text-center subtitle">St. Joseph's College of Engineering</h6>
            
            <form id="loginForm">
                <div class="form-floating mb-3">
                    <input type="text" id="name" name="name" class="form-control input-3d" placeholder="Full Name" required>
                    <label for="name">Full Name</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="text" id="number" name="number" class="form-control input-3d" placeholder="Roll Number" required>
                    <label for="number">Roll Number</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="text" id="dept" name="dept" class="form-control input-3d" placeholder="Dept & Sec" required>
                    <label for="dept">Dept & Sec</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="email" id="email" name="email" class="form-control input-3d" placeholder="Email ID" required>
                    <label for="email">Email ID</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="tel" id="phone" name="phone" class="form-control input-3d" placeholder="Phone Number" required>
                    <label for="phone">Phone Number</label>
                </div>
                <button type="submit" class="btn btn-primary btn-3d">Register</button>
            </form>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        // Import Firebase SDK
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-analytics.js";

        // 🔹 Replace with your actual Firebase Config
        const firebaseConfig = {
  apiKey: "AIzaSyCLZpndyGWe42cZK-eM3ZxsblS-6E75XQI",
  authDomain: "logi-67986.firebaseapp.com",
  projectId: "logi-67986",
  storageBucket: "logi-67986.firebasestorage.app",
  messagingSenderId: "127110029452",
  appId: "1:127110029452:web:57a2d17ae0e890ea951ba9",
  measurementId: "G-7KM68DX14P"
};
        

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        // Form Submission to Firestore
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const dept = document.getElementById('dept').value;
            const number = document.getElementById('number').value;
            
            try {
                await addDoc(collection(db, 'staff-details'), { 
                    name, 
                    email, 
                    phone, 
                    dept, 
                    roll_number: number 
                });
                alert('Data has been saved successfully!');
                document.getElementById('loginForm').reset();
                window.location.href = 'otp.html';  // Changed to opt.html
            } catch (error) {
                console.error('Error adding document: ', error);
                alert('Error saving data: ' + error);
            }
        });
        
// Select elements
const profilePic = document.getElementById('profilePic');
const uploadPicBtn = document.getElementById('uploadPicBtn');
const profileInput = document.getElementById('profileInput');

// Event listener for "Add Profile Picture" button
uploadPicBtn.addEventListener('click', () => {
    profileInput.click(); // Open file picker
});

// Event listener for file selection
profileInput.addEventListener('change', function () {
    const file = this.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function (event) {
            const imageDataUrl = event.target.result;
            localStorage.setItem('profilePic', imageDataUrl); // Save image in localStorage
            profilePic.src = imageDataUrl; // Update profile picture
        };
        reader.readAsDataURL(file);
    }
});

// Load saved profile picture from localStorage
window.onload = function () {
    const savedPic = localStorage.getItem('profilePic');
    if (savedPic) {
        profilePic.src = savedPic;
    }
};


    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
