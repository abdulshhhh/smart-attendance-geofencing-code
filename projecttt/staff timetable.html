<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Faculty Timetable</title>

    <style type="text/css">
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #0b07d6;
            font-size: 28px;
            margin-bottom: 10px;
        }

        table {
            width: 90%;
            max-width: 900px;
            margin: 20px auto;
            border-collapse: collapse;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            background: white;
        }

        th, td {
            padding: 15px;
            text-align: center;
            border: 1px solid #ddd;
        }

        th {
            background-color: #3498db;
            color: white;
            font-size: 16px;
        }

        td {
            background-color: #f9f9f9;
            font-size: 14px;
        }

        .period-button {
            padding: 10px 20px;
            font-size: 14px;
            border: none;
            background-color: #2c3e50;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }

        .period-button:hover {
            background-color: #1a252f;
        }

        .popup {
            display: none;
            position: fixed;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 20px;
            border-radius: 8px;
            opacity: 0.9;
            z-index: 1000;
        }

        .popup.show {
            display: block;
            animation: fadeInOut 3s forwards;
        }

        @keyframes fadeInOut {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 0; }
        }

        /* Dark Mode */
        body.dark-mode {
            background-color: #000000;
            color: #f4f4f4;
        }

        /* Dark Mode Table */
        body.dark-mode table {
            background-color: #333;fa
        }
    </style>
</head>
<body>

    <h1>Faculty Timetable - St. Joseph's College of Engineering</h1>

    <table>
        <thead>
            <tr>
                <th>Day</th>
                <th>Period</th>
                <th>Time</th>
                <th>Venue</th>
            </tr>
        </thead>
        <tbody id="timetable-body">
            <!-- Timetable Rows will be dynamically inserted here -->
        </tbody>
    </table>

    <div id="popup" class="popup"></div>

    <script>
        function generateTimetable() {
            let timetableBody = document.getElementById('timetable-body');
            timetable.forEach(day => {
                day.periods.forEach(period => {
                    let row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${day.day}</td>
                        <td>Period ${period.period}</td>
                        <td>${period.time}</td>
                        <td>${period.venue}</td>
                    `;
                    timetableBody.appendChild(row);
                });
            });
        }

        window.onload = generateTimetable;
    </script>
</body>
</html>
