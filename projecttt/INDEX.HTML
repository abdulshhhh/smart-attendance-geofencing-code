<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Attendance System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css">
    <style>
        /* Background */
        body {
            background: url("St.jpg") no-repeat center center/cover;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Profile Card */
        .profile-card {
            width: 320px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0px 10px 30px rgba(0, 255, 255, 0.2);
            text-align: center;
            transform: translateY(50px);
            transition: transform 0.5s ease, box-shadow 0.5s ease;
        }

        .profile-card:hover {
            transform: translateY(0);
            box-shadow: 0px 20px 40px rgba(0, 255, 255, 0.5);
        }

        .profile-pic {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #0ff;
            margin-bottom: 10px;
        }

        .profile-info h3 {
            font-size: 20px;
            color: #0ff;
        }

        .profile-info p {
            font-size: 14px;
            color: #ddd;
        }

        .profile-buttons button {
            background: #0ff;
            color: #000;
            border: none;
            padding: 10px 16px;
            font-size: 14px;
            border-radius: 5px;
            transition: all 0.3s;
            margin: 5px;
            cursor: pointer;
        }

        .profile-buttons button:hover {
            background: #ff00ff;
            color: #fff;
        }
    </style>
</head>
<body>

<!-- Profile Card -->
<div class="profile-card">
    <div class="profile-info">
        <img src="C:\Users\LENOVO\project\project\mypic.jpg" alt="Profile" class="profile-pic">
        <h3>Abdul Kamil</h3>
        <p>Roll No: 123456</p>
        <p>Dept: Computer Science</p>
        <p>Email: abdul@example.com</p>
        <p>Phone: +91 98765 43210</p>
    </div>
    <div class="profile-buttons">
        <button onclick="window.location.href='timetable.html'">View Attendance</button>
        <button onclick="window.location.href='edit-profile.html'">Edit Profile</button>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
