<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance MarkIn</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 20px;
            background: url('St.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #1C1C1C;
            text-align: center;
        }

        h2 {
            font-size: 2em;
            color: #004AAD;
        }

        select {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
            background: #004AAD;
            color: white;
            font-weight: bold;
            transition: 0.3s;
            margin: 10px;
        }

        select:hover {
            background: #003080;
        }

        table {
            width: 90%;
            margin: 20px auto;
            border-collapse: collapse;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }

        th, td {
            border: 1px solid #004AAD;
            padding: 12px;
            text-align: center;
        }

        th {
            background: linear-gradient(to bottom, #004AAD, #003080);
            color: white;
            font-size: 16px;
        }

        td {
            font-size: 14px;
            color: #1C1C1C;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
        }

        td:hover {
            background-color: rgba(0, 74, 173, 0.1);
            transform: scale(1.02);
        }

        button {
            padding: 10px;
            background: linear-gradient(to right, #004AAD, #003080);
            color: white;
            font-size: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
        }

        button:hover {
            background: #003080;
            transform: scale(1.05);
        }

        /* Selected period highlight */
        .selected-period {
            background-color: rgba(0, 74, 173, 0.2);
            font-weight: bold;
        }

        /* Period visualization container */
        .period-visualization {
            width: 90%;
            margin: 20px auto;
            padding: 20px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
            display: none;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .period-visualization h3 {
            color: #004AAD;
            margin-bottom: 15px;
        }

        .period-details {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            gap: 20px;
        }

        .day-card {
            background: linear-gradient(to bottom right, #f8f9fa, #e9ecef);
            border-radius: 10px;
            padding: 15px;
            width: 180px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .day-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }

        .day-header {
            font-weight: bold;
            color: #004AAD;
            font-size: 16px;
            padding-bottom: 8px;
            border-bottom: 2px solid #004AAD;
            margin-bottom: 10px;
        }

        .subject-name {
            font-size: 14px;
            margin-bottom: 8px;
        }

        .attendance-status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 15px;
            background-color: #f8d7da;
            color: #721c24;
            font-size: 12px;
            margin-top: 5px;
        }

        .marked {
            background-color: #d4edda;
            color: #155724;
        }

        /* Modal styles */
        .modal-overlay {
            display: block;
            opacity: 0;
            visibility: hidden;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 999;
            transition: opacity 0.3s ease-in-out;
        }

        .modal {
            display: block;
            opacity: 0;
            visibility: hidden;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -60%);
            background: linear-gradient(to right, #f9f9f9, #f1f1f1);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
        }

        .modal.active {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%);
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-header {
            font-size: 20px;
            font-weight: bold;
            color: #003080;
            margin-bottom: 20px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
        }

        .modal-body {
            font-size: 16px;
            color: #333;
            margin-bottom: 20px;
        }

        .modal button,
        .modal a {
            margin: 5px;
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(to right, #004AAD, #0073FF);
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .modal button:hover,
        .modal a:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        @keyframes slideIn {
            from {
                transform: translate(-50%, -60%);
                opacity: 0;
            }
            to {
                transform: translate(-50%, -50%);
                opacity: 1;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <h2>📅 Smart Attendance MarkIn</h2>
    
    <div>
        <label for="dayFilter">Filter by Day:</label>
        <select id="dayFilter" onchange="filterTable()">
            <option value="All">All Days</option>
            <option value="Monday">Monday</option>
            <option value="Tuesday">Tuesday</option>
            <option value="Wednesday">Wednesday</option>
            <option value="Thursday">Thursday</option>
            <option value="Friday">Friday</option>
            <option value="Saturday">Saturday</option>
        </select>
        
        <label for="periodFilter">Filter by Period:</label>
        <select id="periodFilter" onchange="filterTable()">
            <option value="All">All Periods</option>
            <option value="Period 1">Period 1</option>
            <option value="Period 2">Period 2</option>
            <option value="Period 3">Period 3</option>
            <option value="Period 4">Period 4</option>
            <option value="Period 5">Period 5</option>
            <option value="Period 6">Period 6</option>
        </select>
    </div>
    
    <table>
        <thead>
            <tr>
                <th>Periods</th>
                <th>Monday</th>
                <th>Tuesday</th>
                <th>Wednesday</th>
                <th>Thursday</th>
                <th>Friday</th>
                <th>Saturday</th>
            </tr>
        </thead>
        <tbody id="attendanceTable"></tbody>
    </table>

    <!-- Period Visualization Section -->
    <div class="period-visualization" id="periodVisualization">
        <h3 id="visualizationTitle">Period Details</h3>
        <div class="period-details" id="periodDetails"></div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" onclick="closeModal()"></div>
    <div class="modal" id="eventModal">
        <div class="modal-header" id="modalHeader"></div>
        <div class="modal-body" id="modalBody"></div>
        
        <a href="camera1.html" onclick="markAttendance()" style="display: block; padding: 8px; background: linear-gradient(to right, #004AAD, #003080); color: white; font-size: 12px; text-align: center; border-radius: 5px; text-decoration: none; transition: transform 0.2s, background 0.3s;">Mark Attendance</a>
        <button onclick="closeModal()">Close</button>
    </div>

    <script>
        const periods = ["Period 1", "Period 2", "Period 3", "Period 4", "Period 5", "Period 6"];
        const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
        const subjects = [
            "Data Structures", "Algorithms", "Operating Systems", 
            "Computer Networks", "Database Management", "AI & ML", "Cyber Security"
        ];

        // Store the schedule data
        let scheduleData = {};
        let attendanceStatus = {};

        // Generate table with random subjects
        function generateTable() {
            const tableBody = document.getElementById('attendanceTable');
            tableBody.innerHTML = periods.map(period => {
                if (!scheduleData[period]) {
                    scheduleData[period] = {};
                }
                
                return `
                    <tr data-period="${period}">
                        <td><b>${period}</b></td>
                        ${days.map(day => {
                            const subject = subjects[Math.floor(Math.random() * subjects.length)];
                            scheduleData[period][day] = subject;
                            
                            // Initialize attendance status
                            if (!attendanceStatus[`${period}-${day}`]) {
                                attendanceStatus[`${period}-${day}`] = Math.random() > 0.5;
                            }
                            
                            return `
                                <td class="${day}" onclick="showEvent('${period}', '${day}', '${subject}')" data-period="${period}" data-day="${day}">
                                    ${subject}
                                </td>`;
                        }).join('')}
                    </tr>
                `;
            }).join('');
            
            // Add event listeners for row selection
            const rows = document.querySelectorAll("#attendanceTable tr");
            rows.forEach(row => {
                row.addEventListener('click', function() {
                    const period = this.getAttribute('data-period');
                    visualizePeriod(period);
                });
            });
        }

        // Show pop-up modal with smooth animation
        function showEvent(period, day, subject) {
            document.getElementById('modalHeader').textContent = `${period} - ${day}`;
            document.getElementById('modalBody').textContent = `Today's Event: Special ${subject} Session`;
            document.querySelector('.modal-overlay').classList.add('active');
            document.getElementById('eventModal').classList.add('active');
        }

        // Close modal with smooth animation
        function closeModal() {
            document.querySelector('.modal-overlay').classList.remove('active');
            document.getElementById('eventModal').classList.remove('active');
        }

        // Visualize the selected period
        function visualizePeriod(period) {
            // Highlight the selected period row
            const rows = document.querySelectorAll("#attendanceTable tr");
            rows.forEach(row => {
                row.classList.remove('selected-period');
                if (row.getAttribute('data-period') === period) {
                    row.classList.add('selected-period');
                }
            });
            
            // Update visualization container
            const visualization = document.getElementById('periodVisualization');
            const visualizationTitle = document.getElementById('visualizationTitle');
            const periodDetails = document.getElementById('periodDetails');
            
            visualizationTitle.textContent = `${period} Schedule Overview`;
            
            // Generate day cards
            let dayCardsHTML = '';
            days.forEach(day => {
                const subject = scheduleData[period][day];
                const isMarked = attendanceStatus[`${period}-${day}`];
                
                dayCardsHTML += `
                    <div class="day-card" onclick="showEvent('${period}', '${day}', '${subject}')">
                        <div class="day-header">${day}</div>
                        <div class="subject-name">${subject}</div>
                        <div class="attendance-status ${isMarked ? 'marked' : ''}">
                            ${isMarked ? 'Marked ✓' : 'Not Marked ✘'}
                        </div>
                    </div>
                `;
            });
            
            periodDetails.innerHTML = dayCardsHTML;
            visualization.style.display = 'block';
        }

        // Simulate marking attendance
        function markAttendance() {
            const periodDay = document.getElementById('modalHeader').textContent.split(' - ');
            const period = periodDay[0];
            const day = periodDay[1];
            
            // Update attendance status
            attendanceStatus[`${period}-${day}`] = true;
            
            // Re-visualize the period if it's currently shown
            const selectedRow = document.querySelector('.selected-period');
            if (selectedRow) {
                const selectedPeriod = selectedRow.getAttribute('data-period');
                visualizePeriod(selectedPeriod);
            }
            
            alert("Leading to the markin page!!!");
            closeModal();
            setTimeout(() => {
                navigateToNextPage("camera1.html");
            }, 500);
        }

        // Filter table by day and period
        function filterTable() {
            const selectedDay = document.getElementById("dayFilter").value;
            const selectedPeriod = document.getElementById("periodFilter").value;
            const rows = document.querySelectorAll("#attendanceTable tr");
            
            rows.forEach(row => {
                const periodMatch = selectedPeriod === "All" || row.getAttribute('data-period') === selectedPeriod;
                
                if (selectedDay === "All") {
                    row.style.display = periodMatch ? "table-row" : "none";
                } else {
                    const hasDayCell = row.querySelector(`.${selectedDay}`);
                    row.style.display = hasDayCell && periodMatch ? "table-row" : "none";
                }
            });
            
            // Hide period visualization if no period is selected
            if (selectedPeriod === "All") {
                document.getElementById('periodVisualization').style.display = 'none';
            } else {
                visualizePeriod(selectedPeriod);
            }
        }

        // Smooth transition to the next page
        function navigateToNextPage(url) {
            document.body.style.animation = "fadeOut 0.5s ease-in-out";
            document.body.addEventListener("animationend", () => {
                window.location.href = url;
            });
        }

        // Generate table on page load
        generateTable();
    </script>
</body>
</html>
