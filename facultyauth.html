<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGEO - Faculty authentication</title>
    <link rel="icon" href="sjce.png" type="image/x-icon">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold fs-3" href="#">REGEO</a>
            <span class="navbar-text text-light mx-auto fw-bold fs-5">ST. JOSEPH'S COLLEGE OF ENGINEERING</span>
        </div>
    </nav>

    <!-- Parallax Background -->
    <div class="parallax"></div>

    <!-- Login Form Container -->
    <div class="container">
        <div class="login-container">
            <h1 class="text-center title">Login</h1>
            <form id="loginForm">
                <div class="form-floating mb-3">
                    <input type="email" id="email" name="email" class="form-control input-3d" placeholder="Email ID" required>
                    <label for="email">Email ID</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="password" id="password" name="password" class="form-control input-3d" placeholder="Password" required>
                    <label for="password">Password</label>
                </div>
                <a href="staffmarkin.html" class="btn btn-primary btn-3d w-100">Login</a>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
